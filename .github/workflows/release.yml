name: Release desktop app

# Builds the ResumeBuild desktop app and publishes installers to GitHub Releases:
#   • ResumeBuild-Setup-x.y.z-windows.exe  (NSIS installer — Windows)
#   • ResumeBuild-x.y.z-macos.dmg          (macOS)
#   • ResumeBuild-x.y.z-linux.AppImage     (Linux)
#
# Trigger it without git:  Actions tab → "Release desktop app" → Run workflow.
# Or with git:             git tag v1.0.0 && git push origin v1.0.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (no v prefix, e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works whether the project sits at the repo root or inside one folder.
      - name: Locate project root
        id: root
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=$(find . -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -1)
            echo "dir=$(dirname "${found:-package.json}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web bundle
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm run build

      - name: Install Electron toolchain
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm i -D electron@31.7.7 electron-builder@24.13.3

      - name: Create version tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ inputs.version }}"
          git push -f origin "v${{ inputs.version }}"

      - name: Package & publish installers to GitHub Releases
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build macOS unsigned so the job passes without an Apple certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always
