#  ⬇ COPY THIS ENTIRE FILE ⬇
#
#  HOW TO USE (takes 2 minutes, no git needed):
#
#  1. Open your repo:  github.com/tzkusman/ResumeBuilder
#  2. Click "Add file" → "Create new file"
#  3. In the "Name your file…" box, type exactly:
#         .github/workflows/release.yml
#     (GitHub creates the .github and workflows folders for you)
#  4. Select ALL of this file (Ctrl+A) → Copy (Ctrl+C)
#  5. Paste into the GitHub editor (Ctrl+V)
#  6. Scroll down → green "Commit changes" button
#  7. Open the Actions tab → "Release desktop app" → Run workflow
#     → type 1.0.0 → green "Run workflow" button
#  8. ~6 minutes later your Releases page has the Windows .exe.
# ================================================================

name: Release desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (no v prefix, e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works whether the project sits at the repo root or inside one folder.
      - name: Locate project root
        id: root
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=$(find . -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -1)
            echo "dir=$(dirname "${found:-package.json}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web bundle (relative asset paths for Electron)
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        # --base=./ makes Vite emit relative asset URLs (./assets/...) so the
        # app loads correctly from file:// inside the packaged desktop app.
        # The Vercel web build is unaffected and still uses absolute paths.
        run: npm run build -- --base=./

      - name: Install Electron toolchain
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm i -D electron@31.7.7 electron-builder@24.13.3

      - name: Create version tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ inputs.version }}"
          git push -f origin "v${{ inputs.version }}"

      - name: Package & publish installers to GitHub Releases
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always
