name: Release desktop app

# Push a tag → installers appear in GitHub Releases automatically:
#   git tag v1.0.0 && git push origin v1.0.0
# Produces: ResumeBuild-Setup-x.y.z-windows.exe (NSIS installer),
#           ResumeBuild-x.y.z-macos.dmg, ResumeBuild-x.y.z-linux.AppImage

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger from the GitHub Actions tab ("Run workflow" button) —
  # lets you build the .exe without installing git or pushing a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        default: "1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Create version tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ inputs.version }}"
          git push -f origin "v${{ inputs.version }}"

      - name: Package & publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build macOS unsigned so the job passes without an Apple certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always
