<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ResumeBuild</title>
<style>
  html, body { margin: 0; height: 100%; background: #131f1a; font-family: Georgia, "Times New Roman", serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #f2f3ec;
         -webkit-app-region: drag; user-select: none; }
  .logo { width: 120px; height: 120px; animation: pop .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { margin: 0; font-size: 34px; letter-spacing: .01em; }
  h1 em { font-style: normal; color: #d9f24f; }
  p { margin: 0; font-family: "Courier New", monospace; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: #8ba196; }
  .bar { width: 220px; height: 4px; background: #233630; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: #d9f24f; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#233630"/>

    <path d="M296 96l68 72h-52a16 16 0 0 1-16-16V96Z" fill="#a8c22e"/>
    <rect x="168" y="204" width="176" height="22" rx="6" fill="#131f1a"/>
    <rect x="168" y="252" width="176" height="22" rx="6" fill="#131f1a"/>
    <rect x="168" y="300" width="112" height="22" rx="6" fill="#131f1a"/>
    <circle cx="352" cy="372" r="60" fill="#ff5a36" stroke="#131f1a" stroke-width="10"/>
    <path d="M326 372l18 18 36-38" fill="none" stroke="#131f1a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Resume<em>Build</em></h1>
  <div class="bar"><i></i></div>
  <p>Connecting to your workspace</p>
</body>
</html>
