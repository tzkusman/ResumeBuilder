name: Release desktop app

# The desktop app wraps the live Vercel site (resume-builder-pd3c.vercel.app),
# so a release only packages the Electron shell — no web build needed.
#
# ⚠️ IMPORTANT — how to trigger:
#   Actions → "Release desktop app" → BLUE "Run workflow" button → type a
#   version → green "Run workflow".
#   NEVER click "Re-run all jobs" on an old failed run: GitHub re-runs use the
#   workflow file as it was at that old commit, so no fix would ever apply.
#
# Icon handling (cannot fail the build):
#   icon.ico in repo root  → used as-is
#   icon.png  in repo root → auto-converted to icon.ico (NSIS needs .ico)
#   neither                → brand icon generated from embedded SVG
#   everything fails       → default Electron icon, build still succeeds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (no v prefix, e.g. 1.1.0)"
        required: true
        default: "1.1.0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works whether the project sits at the repo root or inside one folder.
      - name: Locate project root
        id: root
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=$(find . -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -1)
            echo "dir=$(dirname "${found:-package.json}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron toolchain
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm i -D electron@31.7.7 electron-builder@24.13.3 --no-package-lock

      - name: Ensure app icon (never fails the build)
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          make_ico() {
            npm i --no-save --no-package-lock png2icons >/dev/null 2>&1
            node -e "const fs=require('fs');const {PNG2ICO}=require('png2icons');PNG2ICO(fs.readFileSync('icon.png'),16,256,true).then(b=>{fs.writeFileSync('icon.ico',Buffer.from(b));console.log('icon.ico written')}).catch(e=>{console.error(e);process.exit(1)})"
          }
          if [ ! -f icon.ico ] && [ -f icon.png ]; then
            make_ico || echo "::warning::repo icon.png could not be converted to ico"
          fi
          if [ ! -f icon.ico ]; then
            printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#131f1a"/><path d="M148 96h148l68 72v248a16 16 0 0 1-16 16H148a16 16 0 0 1-16-16V112a16 16 0 0 1 16-16Z" fill="#d9f24f"/><path d="M296 96l68 72h-52a16 16 0 0 1-16-16V96Z" fill="#a8c22e"/><rect x="168" y="204" width="176" height="22" rx="6" fill="#131f1a"/><rect x="168" y="252" width="176" height="22" rx="6" fill="#131f1a"/><rect x="168" y="300" width="112" height="22" rx="6" fill="#131f1a"/><circle cx="352" cy="372" r="60" fill="#ff5a36" stroke="#131f1a" stroke-width="10"/><path d="M326 372l18 18 36-38" fill="none" stroke="#131f1a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>' > .icon-source.svg
            npx --yes sharp-cli -i .icon-source.svg -o .icon-fallback.png resize 1024 1024 || true
            rm -f .icon-source.svg
            if [ -f .icon-fallback.png ]; then
              cp .icon-fallback.png icon.png
              rm -f .icon-fallback.png
              make_ico || echo "::warning::fallback icon could not be converted to ico"
            fi
          fi
          echo "--- icon files present in project root:"
          ls -la | grep -i 'icon' || echo "(none - default Electron icon will be used, build continues)"

      - name: Create version tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ inputs.version }}"
          git push -f origin "v${{ inputs.version }}"

      - name: Package & publish installers to GitHub Releases
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build macOS unsigned so the job passes without an Apple certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always
