# ResumeBuild — desktop packaging config (electron-builder)
# Triggered automatically by .github/workflows/release.yml on version tags
# or via Actions → "Release desktop app" → Run workflow.
#
# The app streams the production site, so only the Electron shell ships:
# electron/, icon.png and package.json. No web bundle, no node_modules.

appId: app.resumebuild.desktop
productName: ResumeBuild
copyright: Copyright © 2026 ResumeBuild

directories:
  output: release

extraMetadata:
  main: electron/main.cjs

files:
  - electron/**/*
  - icon.png
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  # The release workflow converts icon.png → icon.ico (NSIS only accepts .ico).
  icon: icon.ico
  artifactName: ResumeBuild-Setup-${version}-windows.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ResumeBuild
  createDesktopShortcut: always
  installerIcon: icon.png
  uninstallerIcon: icon.png

mac:
  target: dmg
  icon: icon.png
  artifactName: ResumeBuild-${version}-macos.${ext}

linux:
  target: AppImage
  icon: icon.png
  artifactName: ResumeBuild-${version}-linux.${ext}
  category: Office

# Auto-detected from the git remote, so repo renames never break releases.
publish:
  provider: github
