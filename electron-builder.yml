# ResumeBuild — desktop packaging config (electron-builder)
# Triggered by .github/workflows/release.yml on version tags / manual runs.
#
# NOTE: no `icon:` line on purpose. electron-builder auto-resolves
# icon.ico from the project root (the release workflow creates it),
# and falls back to the default icon if absent — so a bad/missing icon
# can never fail the build.

appId: app.resumebuild.desktop
productName: ResumeBuild
copyright: Copyright (c) 2026 ResumeBuild

directories:
  output: release

extraMetadata:
  main: electron/main.cjs

# Only the Electron wrapper is packaged — the app streams the live
# Vercel site, so there is no web bundle to ship.
files:
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ResumeBuild-Setup-${version}-windows.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ResumeBuild
  createDesktopShortcut: always

mac:
  target: dmg
  artifactName: ResumeBuild-${version}-macos.${ext}

linux:
  target: AppImage
  artifactName: ResumeBuild-${version}-linux.${ext}
  category: Office

# Auto-detected from the git remote (owner/repo intentionally omitted,
# so this works regardless of repository renames).
publish:
  provider: github
